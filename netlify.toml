[build]
  command = "npm run build"
  publish = "dist"

# El service worker, el index y el JSON de la cartilla deben revisarse en cada visita
# para que una versión nueva llegue; lo que lleva hash en el nombre no cambia nunca.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/cartillas/*/cartilla.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
