[build]
  command = "npm run build"
  publish = "dist"

# Lo que lleva hash en el nombre no cambia nunca. El service worker ya revalida sw.js,
# index.html y cartilla.json por su cuenta, así que no necesitan reglas aquí.
# La ruta es la de la raíz del sitio publicado en Netlify; si algún día se publica en una
# subcarpeta, esta regla debe llevar ese prefijo.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
